<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify your account</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background: #030304;

    color: #fff;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}


/* =========================================================
   MAIN BACKGROUND
========================================================= */

.page {
    position: relative;

    width: 100%;
    height: 100vh;

    min-height: 620px;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse 58% 62% at 24% 12%,
            rgba(126, 0, 38, .48) 0%,
            rgba(83, 0, 28, .28) 30%,
            rgba(40, 0, 18, .12) 52%,
            transparent 75%
        ),

        radial-gradient(
            ellipse 55% 65% at 82% 78%,
            rgba(110, 0, 34, .38) 0%,
            rgba(65, 0, 24, .20) 40%,
            transparent 76%
        ),

        linear-gradient(
            135deg,
            #080506 0%,
            #030304 48%,
            #080305 100%
        );
}


/* =========================================================
   GRID
========================================================= */

.grid {
    position: absolute;

    inset: 0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.033) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.033) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    opacity: .78;
}


/* =========================================================
   ATMOSPHERIC GLOWS
========================================================= */

.glow {
    position: absolute;

    width: 700px;
    height: 700px;

    border-radius: 50%;

    filter: blur(100px);

    pointer-events: none;
}

.glow-left {
    left: -300px;
    top: -330px;

    background:
        rgba(150, 0, 42, .23);

    animation:
        glowLeft 10s ease-in-out infinite alternate;
}

.glow-right {
    right: -300px;
    bottom: -370px;

    background:
        rgba(125, 0, 37, .20);

    animation:
        glowRight 12s ease-in-out infinite alternate;
}


@keyframes glowLeft {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    100% {
        transform:
            translate(70px,55px)
            scale(1.12);
    }
}


@keyframes glowRight {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    100% {
        transform:
            translate(-55px,-45px)
            scale(1.1);
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.particles {
    position: absolute;

    inset: 0;

    pointer-events: none;
}

.particle {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: #d51b4a;

    box-shadow:
        0 0 5px #d51b4a,
        0 0 12px rgba(213,27,74,.45);

    animation:
        particleMove linear infinite;
}


@keyframes particleMove {

    0% {
        opacity: 0;

        transform:
            translateY(30px)
            scale(.5);
    }

    20% {
        opacity: .8;
    }

    70% {
        opacity: .35;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-75px)
            scale(1);
    }
}


/* =========================================================
   CENTER
========================================================= */

.center {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


/* =========================================================
   CARD
========================================================= */

.card {
    position: relative;

    width: 460px;

    min-height: 408px;

    padding:
        36px
        32px
        34px;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(24,14,18,.97),
            rgba(13,8,11,.98)
        );

    border:
        1px solid rgba(255,255,255,.13);

    box-shadow:

        0 30px 80px
        rgba(0,0,0,.65),

        0 0 0 1px
        rgba(255,0,70,.025),

        inset 0 1px 0
        rgba(255,255,255,.035);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    animation:
        cardAppear
        .75s
        cubic-bezier(.2,.8,.2,1)
        both;

    transition:
        transform .2s ease;
}


.card::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,40,82,.05),
            transparent 48%
        );

    pointer-events: none;
}


@keyframes cardAppear {

    from {
        opacity: 0;

        transform:
            translateY(20px)
            scale(.965);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   SECURITY BADGE
========================================================= */

.badge {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    width: fit-content;

    margin:
        0 auto
        14px;

    padding:
        5px
        12px;

    border-radius: 999px;

    border:
        1px solid
        rgba(255,48,93,.55);

    background:
        rgba(118,0,34,.16);

    color:
        #ff8ba5;

    font-size: 12px;

    font-weight: 600;

    letter-spacing: .1px;

    box-shadow:
        0 0 18px
        rgba(255,0,65,.07);

    animation:
        badgePulse
        3s
        ease-in-out
        infinite;
}


.badge-icon {

    width: 13px;
    height: 13px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.badge-icon svg {

    width: 13px;
    height: 13px;

    stroke: currentColor;
}


@keyframes badgePulse {

    0%,
    100% {

        box-shadow:
            0 0 14px
            rgba(255,0,65,.04);
    }

    50% {

        box-shadow:
            0 0 23px
            rgba(255,0,65,.14);
    }
}


/* =========================================================
   TITLE
========================================================= */

.title {

    position: relative;

    text-align: center;

    color: #fff;

    font-size: 31px;

    line-height: 1.15;

    letter-spacing:
        -1.15px;

    font-weight: 750;

    margin-bottom: 17px;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description {

    position: relative;

    max-width: 395px;

    margin:
        0 auto;

    text-align: center;

    color: #969096;

    font-size: 14px;

    line-height: 1.45;

    font-weight: 450;
}


.server-name {

    color: #ded9dd;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 14px;

    font-weight: 700;
}


/* =========================================================
   SERVER
========================================================= */

.server {

    position: relative;

    display: flex;

    align-items: center;

    width: 100%;

    height: 74px;

    margin-top: 18px;

    padding:
        10px
        15px;

    border-radius: 16px;

    background:
        rgba(255,255,255,.028);

    border:
        1px solid
        rgba(255,255,255,.12);

    transition:
        background .25s ease,
        border-color .25s ease,
        transform .25s ease;
}


.server:hover {

    background:
        rgba(255,255,255,.045);

    border-color:
        rgba(255,255,255,.17);

    transform:
        translateY(-1px);
}


/* =========================================================
   SERVER LOGO
========================================================= */

.server-logo {

    position: relative;

    flex: 0 0 auto;

    width: 46px;
    height: 46px;

    margin-right: 12px;

    overflow: hidden;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.14);

    background:

        radial-gradient(
            circle at 50% 30%,
            #d02048 0%,
            #82112d 25%,
            #3a091c 52%,
            #100308 100%
        );

    box-shadow:

        0 0 0 2px
        rgba(0,0,0,.4),

        0 0 20px
        rgba(150,0,42,.2);
}


/*
   Decorative logo
*/

.server-logo::before {

    content: "MGC";

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #f5d9df;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 11px;

    font-weight: 900;

    letter-spacing:
        -1.2px;

    text-shadow:
        0 2px 4px #000;
}


.server-logo::after {

    content: "";

    position: absolute;

    width: 28px;

    height: 9px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%,8px)
        rotate(-9deg);

    border-bottom:
        2px solid
        #e02950;

    border-radius: 50%;
}


/* =========================================================
   SERVER INFORMATION
========================================================= */

.server-info {

    flex: 1;

    min-width: 0;
}


.server-title {

    display: flex;

    align-items: center;

    gap: 4px;

    color: #eee9ec;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 14px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.devil {

    font-family:
        sans-serif;
}


.server-stats {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 5px;

    color: #787379;

    font-size: 12px;
}


.online {

    display: inline-flex;

    align-items: center;

    gap: 5px;
}


.online-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #31d084;

    box-shadow:
        0 0 7px
        rgba(49,208,132,.55);
}


.separator {

    color: #4e494d;
}


/* =========================================================
   DISCORD BUTTON
========================================================= */

.discord-button {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 11px;

    width: 100%;

    height: 51px;

    margin-top: 16px;

    border: none;

    outline: none;

    border-radius: 14px;

    cursor: pointer;

    color: #fff;

    font-family: inherit;

    font-size: 15px;

    font-weight: 700;

    background:

        linear-gradient(
            100deg,
            #ff3158 0%,
            #ee244b 42%,
            #a9002c 100%
        );

    box-shadow:

        0 11px 25px
        rgba(225,0,48,.22),

        inset 0 1px 0
        rgba(255,255,255,.12);

    overflow: hidden;

    transition:

        transform .18s ease,

        box-shadow .18s ease,

        filter .18s ease;
}


/* Shine */

.discord-button::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            110deg,
            transparent 20%,
            rgba(255,255,255,.15) 45%,
            transparent 70%
        );

    transform:
        translateX(-120%);

    transition:
        transform .6s ease;
}


.discord-button:hover::before {

    transform:
        translateX(120%);
}


.discord-button:hover {

    transform:
        translateY(-1px);

    filter:
        brightness(1.05);

    box-shadow:

        0 15px 32px
        rgba(225,0,48,.30),

        inset 0 1px 0
        rgba(255,255,255,.15);
}


.discord-button:active {

    transform:
        translateY(1px)
        scale(.995);

    box-shadow:

        0 7px 17px
        rgba(225,0,48,.2);
}


/* =========================================================
   DISCORD ICON
========================================================= */

.discord-icon {

    position: relative;

    z-index: 2;

    width: 17px;
    height: 17px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.discord-icon svg {

    width: 17px;
    height: 17px;

    fill: white;
}


.button-text {

    position: relative;

    z-index: 2;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 4px;

    margin-top: 16px;

    color: #5f5a5e;

    font-size: 11px;

    white-space: nowrap;
}


.footer svg {

    width: 11px;
    height: 11px;

    stroke:
        #696367;
}


.footer span {

    transition:
        color .2s ease;
}


.footer span:hover {

    color:
        #8e888d;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 600px) {

    .card {

        width:
            min(
                460px,
                calc(100vw - 28px)
            );

        padding:
            30px
            20px
            28px;

        border-radius: 20px;
    }

    .title {

        font-size: 27px;
    }

    .description {

        font-size: 13px;
    }

    .server {

        height: 70px;
    }
}


@media (max-height: 650px) {

    .card {

        transform:
            scale(.92);
    }
}

</style>
</head>


<body>


<!-- =====================================================
     PAGE
===================================================== -->

<div class="page">


    <!-- GRID -->

    <div class="grid"></div>


    <!-- GLOW -->

    <div class="glow glow-left"></div>

    <div class="glow glow-right"></div>


    <!-- PARTICLES -->

    <div
        class="particles"
        id="particles">
    </div>


    <!-- =================================================
         CENTER
    ================================================= -->

    <main class="center">


        <!-- =================================================
             CARD
        ================================================= -->

        <section class="card" id="card">


            <!-- =================================================
                 SECURITY BADGE
            ================================================= -->

            <div class="badge">


                <span class="badge-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path
                            d="
                            M12 3
                            l8 3
                            v6
                            c0 5-3.5 8-8 9
                            c-4.5-1-8-4-8-9
                            V6
                            l8-3z
                            "
                        />

                        <path
                            d="
                            M9.5 12
                            l1.6 1.6
                            l3.5-3.7
                            "
                        />

                    </svg>

                </span>


                <span>
                    Protected by NexOAuth2
                </span>


            </div>


            <!-- =================================================
                 TITLE
            ================================================= -->

            <h1 class="title">
                Verify your account
            </h1>


            <!-- =================================================
                 DESCRIPTION
            ================================================= -->

            <p class="description">

                Confirm your Discord identity to unlock
                <span class="server-name">
                    Mafia China CTR
                </span>

                <br>

                👹 and its 3,935 members.

            </p>


            <!-- =================================================
                 SERVER CARD
            ================================================= -->

            <div class="server">


                <!-- LOGO -->

                <div class="server-logo"></div>


                <!-- INFORMATION -->

                <div class="server-info">


                    <div class="server-title">

                        Mafia China CTR

                        <span class="devil">
                            👹
                        </span>

                    </div>


                    <div class="server-stats">


                        <span class="online">

                            <span class="online-dot"></span>

                            <span>
                                525 online
                            </span>

                        </span>


                        <span class="separator">
                            •
                        </span>


                        <span>
                            3,935 members
                        </span>


                    </div>


                </div>


            </div>


            <!-- =================================================
                 DISCORD BUTTON
            ================================================= -->

            <button
                class="discord-button"
                id="discordButton"
                type="button"
            >


                <span class="discord-icon">

                    <svg
                        viewBox="0 0 24 24"
                    >

                        <path
                            d="
                            M19.54 5.3
                            A16.2 16.2 0 0 0 15.5 4
                            l-.5 1
                            a14.4 14.4 0 0 0-6 0
                            l-.5-1
                            a16.2 16.2 0 0 0-4 1.3
                            C1.9 9.3 1.2 13.2 1.5 17
                            a16.4 16.4 0 0 0 5 2.5
                            l1.2-1.6
                            c-.7-.3-1.4-.7-2-1.1
                            l.5-.4
                            c3.9 1.8 8.1 1.8 12 0
                            l.5.4
                            c-.6.4-1.3.8-2 1.1
                            l1.2 1.6
                            a16.4 16.4 0 0 0 5-2.5
                            c.4-4.4-.7-8.2-3.4-11.7z

                            M8.7 15.2
                            c-1.2 0-2.1-1.1-2.1-2.5
                            s.9-2.5 2.1-2.5
                            2.1 1.1 2.1 2.5
                            -.9 2.5-2.1 2.5z

                            m6.6 0
                            c-1.2 0-2.1-1.1-2.1-2.5
                            s.9-2.5 2.1-2.5
                            2.1 1.1 2.1 2.5
                            -.9 2.5-2.1 2.5z
                            "
                        />

                    </svg>

                </span>


                <span class="button-text">
                    Continue with Discord
                </span>


            </button>


            <!-- =================================================
                 FOOTER
            ================================================= -->

            <div class="footer">


                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >

                    <path
                        d="
                        M12 3
                        l8 3
                        v6
                        c0 5-3.5 8-8 9
                        c-4.5-1-8-4-8-9
                        V6
                        l8-3z
                        "
                    />

                </svg>


                <span>
                    Secured by NexOAuth2
                </span>


                <span>·</span>


                <span>
                    Privacy policy
                </span>


                <span>·</span>


                <span>
                    Terms of service
                </span>


            </div>


        </section>


    </main>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =========================================================
   CREATE PARTICLES
========================================================= */

const particleContainer =
    document.getElementById("particles");

const particleCount = 42;


for (
    let i = 0;
    i < particleCount;
    i++
) {

    const particle =
        document.createElement("span");


    particle.className =
        "particle";


    particle.style.left =
        Math.random() * 100 + "%";


    particle.style.top =
        Math.random() * 100 + "%";


    const size =
        Math.random() > .82
            ? 2
            : 1;


    particle.style.width =
        size + "px";


    particle.style.height =
        size + "px";


    particle.style.animationDuration =
        (5 + Math.random() * 9) + "s";


    particle.style.animationDelay =
        (-Math.random() * 12) + "s";


    particle.style.opacity =
        .2 + Math.random() * .7;


    particleContainer.appendChild(
        particle
    );
}


/* =========================================================
   DISCORD BUTTON
========================================================= */

const discordButton =
    document.getElementById(
        "discordButton"
    );


discordButton.addEventListener(
    "click",
    function () {

        /*
         * TU INVITACIÓN DE DISCORD
         *
         * Al hacer click se abre directamente
         * la invitación del servidor.
         */

        window.location.href =
            "https://discord.gg/sp7qqaK52";

    }
);


/* =========================================================
   SUBTLE MOUSE PARALLAX
========================================================= */

const card =
    document.getElementById("card");


let mouseX = 0;
let mouseY = 0;


document.addEventListener(
    "mousemove",
    function (event) {

        mouseX =
            (event.clientX /
                window.innerWidth
            - .5);

        mouseY =
            (event.clientY /
                window.innerHeight
            - .5);

        card.style.transform =
            `translate(
                ${mouseX * 3}px,
                ${mouseY * 3}px
            )`;
    }
);


document.addEventListener(
    "mouseleave",
    function () {

        card.style.transform =
            "translate(0,0)";
    }
);


</script>


</body>
</html>
